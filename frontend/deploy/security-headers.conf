# included by every location that sets a header of its own: nginx drops the
# inherited add_header list as soon as a level declares one.

# 'unsafe-inline' for styles is not optional here - react writes the canvas
# size as a style attribute, and the print sheet carries its own <style>.
# blob: and data: on img-src are the two schemes a canvas exports through.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; font-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# the camera is the one capture device the app asks for; nothing else is used
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;

# tls terminates at the edge proxy, which is also where the redirect to https
# lives; this only tells the browser not to come back over http
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
